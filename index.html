<style>
[hidden]{display:none!important}
:root{--cream:#fbf5e9;--ink:#2b2b2b;--sky:#7ec8f0;--yel:#ffd34d;--org:#ff8a3d;--pink:#ff9ec4;--grn:#7bd389;--soft:#6d6a63;
  --round:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--cream)}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--round);color:var(--ink);overflow:hidden;height:100svh;background:var(--cream)}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.view{position:fixed;inset:0;height:100svh;overflow:hidden;z-index:2;background:var(--cream)}
.wrap{position:relative;height:100%;max-width:480px;margin:0 auto}
/* 蛍光ペンの線（ヘッダーの「本気」と同じ） */
.mk{background:linear-gradient(transparent 58%,var(--yel) 58%,var(--yel) 92%,transparent 92%);padding:0 .08em}

#loading{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--cream);transition:opacity .35s}
#loading .drop{position:relative;width:120px;height:92px}
#loading .drop svg{position:absolute;left:44px;top:0;width:34px;height:34px;animation:fall 1.1s cubic-bezier(.5,0,.9,.6) infinite}
#loading .drop i{position:absolute;left:22px;bottom:4px;width:78px;height:10px;border:2.5px solid var(--ink);border-radius:6px;background:#fff}
@keyframes fall{0%{transform:translateY(-6px) rotate(-14deg);opacity:0}15%{opacity:1}80%{transform:translateY(46px) rotate(8deg)}90%{transform:translateY(42px) rotate(0)}100%{transform:translateY(46px);opacity:0}}
#loading p{font-size:15px;font-weight:800;color:var(--soft);letter-spacing:.06em}
#loadBar{width:140px;height:4px;background:rgba(43,43,43,.12);border-radius:2px;overflow:hidden}
#loadBar i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}

/* タイトル */
#vTitle .wrap{display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top)) 20px calc(14px + calc(env(safe-area-inset-bottom) + var(--inapp-bot,0px)))}
#tH{font-weight:800;font-size:min(14vw,62px,7.8svh);line-height:1.08;letter-spacing:.01em}
#tH span{display:block}
#tH .b{margin-left:.9em;width:fit-content}
#tSub{margin-top:8px;font-size:15px;font-weight:500;color:var(--soft)}
#tArtBox{flex:1;min-height:0;position:relative}
#tArt{position:absolute;inset:0;width:100%;height:100%}
#tBest{font-size:14px;font-weight:800;min-height:18px;text-align:center;margin-bottom:6px}
/* 一番押してほしいボタン = 水色が持つ白い板 */
#bStart{align-self:center;width:min(74vw,290px);height:62px;background:#fff;border:3px solid var(--ink);border-radius:16px;font-size:23px;font-weight:800;letter-spacing:.14em;transform:rotate(-1.5deg);box-shadow:0 5px 0 var(--ink)}
#bStart:active{transform:rotate(-1.5deg) translateY(4px);box-shadow:0 1px 0 var(--ink)}
.tLinks{display:flex;gap:16px;justify-content:center;margin-top:12px;align-items:center}
.tLinks button{min-height:44px;padding:0 8px;font-size:15px;font-weight:800;color:var(--soft)}
.ico{width:22px;height:22px;fill:none;stroke:var(--soft);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* 遊ぶ */
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;left:0;right:0;top:0;z-index:5;pointer-events:none;padding:calc(10px + env(safe-area-inset-top)) 12px 0 12px;display:flex;justify-content:space-between;align-items:flex-start}
#hL{background:rgba(251,245,233,.9);border-radius:14px;padding:6px 12px 8px}
#hN{text-shadow:0 0 3px var(--cream),0 0 6px var(--cream),0 0 10px var(--cream);font-size:46px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
#hN small{font-size:20px;margin-left:2px}
#hX{display:flex;gap:7px;margin-top:6px}
#hX i{display:block;width:16px;height:16px;border:2.5px solid var(--ink);border-radius:50%}
#hX i.on{background:var(--org)}
#bMute2{width:44px;height:44px;display:flex;align-items:center;justify-content:center;pointer-events:auto}
#bub{position:absolute;z-index:8;max-width:60%;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:3px 11px 4px;font-size:15px;font-weight:800;line-height:1.3;width:max-content;pointer-events:none;opacity:0;transition:opacity .12s;transform:translate(-50%,-100%)}
#bub.on{opacity:1}
#pop{position:absolute;z-index:6;color:var(--ink);-webkit-text-stroke:6px var(--cream);paint-order:stroke fill;left:50%;top:30%;transform:translate(-50%,-50%);font-size:30px;font-weight:800;white-space:nowrap;pointer-events:none;opacity:0}
#pop.on{animation:pop 1.3s ease-out forwards}
#pop.bad{color:var(--org)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%)}12%{opacity:1;transform:translate(-50%,-50%)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-64%)}}
#tut{position:absolute;left:0;right:0;bottom:calc(18px + calc(env(safe-area-inset-bottom) + var(--inapp-bot,0px)));z-index:6;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;transition:opacity .4s}
#tut svg{width:120px;height:56px}
#tut .hand{animation:swipe 1.6s ease-in-out infinite}
@keyframes swipe{0%,100%{transform:translateX(-30px)}50%{transform:translateX(30px)}}
#tut p{font-size:15px;font-weight:800;background:rgba(251,245,233,.92);padding:2px 10px;border-radius:8px}

/* 結果 */
#vEnd .wrap{display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 14px calc(8px + calc(env(safe-area-inset-bottom) + var(--inapp-bot,0px)))}
#resBox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#res{max-width:100%;max-height:100%;aspect-ratio:4/5;border:2.5px solid var(--ink);border-radius:6px;transform:rotate(-.8deg)}
#res.in{animation:resIn .5s ease-out}
@keyframes resIn{from{transform:translateY(24px) rotate(-3deg);opacity:0}to{transform:rotate(-.8deg);opacity:1}}
.endBtns{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:10px}
.endBtns .row{display:flex;gap:10px;justify-content:center;width:100%}
.endBtns .row button{min-height:44px;padding:0 16px;font-size:15px;font-weight:800;color:var(--ink);border:2px solid var(--ink);border-radius:22px;background:#fff}
#bAgain{width:min(70vw,260px);height:56px;background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);font-size:20px;font-weight:800;letter-spacing:.1em;transform:rotate(1deg)}
#bAgain:active{transform:rotate(1deg) translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* 遊び方 */
.ovl{position:fixed;inset:0;z-index:80;background:rgba(43,43,43,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.ovl .in{position:relative;width:min(100%,420px);max-height:calc(100svh - 32px);overflow:auto;padding:20px 18px 14px;background:var(--cream);border:3px solid var(--ink);border-radius:18px}
.ovl h3{font-size:22px;font-weight:800;margin-bottom:10px}
.ovl ol{padding-left:1.2em;display:flex;flex-direction:column;gap:9px;font-size:15px;font-weight:500;line-height:1.6}
.ovl ol b{font-weight:800;background:linear-gradient(transparent 60%,var(--yel) 60%)}
.ovl small{display:block;margin-top:12px;font-size:11px;line-height:1.5;color:var(--soft)}
.ovl .close{display:block;margin:12px auto 0;min-height:44px;padding:0 24px;font-size:16px;font-weight:800;border:2.5px solid var(--ink);border-radius:12px;background:#fff}
@media (max-height:700px){#tH{font-size:min(12vw,50px,7.4svh)}#bStart{height:54px}.tLinks{margin-top:4px}#hN{font-size:38px}.ovl ol{font-size:14px;gap:6px}#bAgain{height:50px}}
</style>
</head>
<body>
<div id="loading"><div class="drop"><svg viewBox="0 0 34 34" aria-hidden="true"><rect x="3" y="5" width="26" height="25" rx="3" fill="#ffd34d" stroke="#2b2b2b" stroke-width="2.5"/><circle cx="12" cy="16" r="1.6" fill="#2b2b2b"/><circle cx="20" cy="16" r="1.6" fill="#2b2b2b"/></svg><i></i></div><p id="loadTxt">みんな集合中</p><div id="loadBar"><i></i></div></div>

<main id="vTitle" class="view">
  <div class="wrap">
    <h1 id="tH"></h1>
    <p id="tSub"></p>
    <div id="tArtBox"><canvas id="tArt" aria-hidden="true"></canvas></div>
    <p id="tBest"></p>
    <button id="bStart"></button>
    <div class="tLinks"><button id="bHow"></button><button id="bLang"></button><button id="bMute" aria-label="sound"><svg class="ico" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5" style="display:none"/></svg></button></div>
  </div>
</main>

<main id="vPlay" class="view" hidden>
  <div class="wrap">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div id="hL"><div id="hN"></div><div id="hX"></div></div>
    <button id="bMute2" aria-label="sound"><svg class="ico" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5" style="display:none"/></svg></button>
  </div>
  <div id="bub"></div>
  <div id="pop"></div>
  <div id="tut"><svg viewBox="0 0 120 56" aria-hidden="true"><path d="M14 40h92" stroke="#2b2b2b" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/><g class="hand"><path d="M54 50c-6-6-10-12-8-15 2-2 5 0 7 3V14c0-3 5-3 5 0v14c0-3 5-3 5 0v2c0-3 5-3 5 0v2c0-3 5-3 5 0v10c0 6-3 10-7 12z" fill="#fff" stroke="#2b2b2b" stroke-width="2.5" stroke-linejoin="round"/></g></svg><p id="tutT"></p></div>
  </div>
</main>

<main id="vEnd" class="view" hidden>
  <div class="wrap">
    <div id="resBox"><canvas id="res" width="1080" height="1350"></canvas></div>
    <div class="endBtns">
      <button id="bAgain"></button>
      <div class="row"><button id="bSave"></button><button id="bPost"></button></div>
    </div>
  </div>
</main>

<div class="ovl" id="how" hidden><div class="in"><h3 id="howH"></h3><ol id="howBody"></ol><small id="howCred"></small><button class="close" id="howClose"></button></div></div>

<script>
(function(){
  var opt={passive:false};
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},opt)});
  document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},opt);
  var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<300&&!(e.target.closest&&e.target.closest('button,a')))e.preventDefault();last=n},opt);
  document.addEventListener('dblclick',function(e){e.preventDefault()},opt);
  window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},opt);
  window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0',';'].indexOf(e.key)>=0)e.preventDefault()});
})();
(function(){
  var errs=[];
  window.addEventListener('error',function(e){errs.push((e.message||'error')+' @'+(e.filename||'')+':'+(e.lineno||''))});
  window.addEventListener('unhandledrejection',function(e){errs.push('reject: '+(e.reason&&e.reason.message||e.reason))});
  // 読み込み中を失敗と出さない: JS が動いたか（__jsUp）で見る
  setTimeout(function(){
    if(window.__jsUp) return;
    var l=document.getElementById('loading');if(l)l.style.display='none';
    var d=document.createElement('div');d.style.cssText='position:fixed;inset:auto 8px 8px 8px;z-index:199;background:#fff;color:#b00;font:12px/1.4 monospace;white-space:pre-wrap;padding:10px';
    d.textContent='起動できませんでした / failed to start\n'+(errs.join('\n')||'(no error captured)')+'\n'+navigator.userAgent;
    document.body.appendChild(d);
  },15000);
})();
</script>
